name: intdemo-uos-arm64
channels:
  - conda-forge
dependencies:
  # UOS 20 ships Python 3.7 for system components.  Keep it untouched and use
  # this isolated ARM64 environment for building the desktop client.
  - python=3.10
  - pip
  - pyqt=5.15.11
  - pyinstaller>=6,<7
  # PyInstaller can otherwise pick UOS 20's older system C++ runtime while
  # collecting conda-forge Qt.  Bundle the matching ARM64 GNU runtimes.
  - libgcc-ng>=12
  - libstdcxx-ng>=12
  - setuptools
  - wheel
