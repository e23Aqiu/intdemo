name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  client-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Windows client tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests

  server-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e "./server[test]"
      - run: ruff check server/app server/tests
      - run: pytest server/tests

  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
        env:
          POSTGRES_USER: intdemo
          POSTGRES_PASSWORD: integration-password
          POSTGRES_DB: intdemo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intdemo -d intdemo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTDEMO_ENVIRONMENT: test
      INTDEMO_DATABASE_URL: postgresql+psycopg://intdemo:integration-password@127.0.0.1:5432/intdemo_test
      INTDEMO_JWT_SECRET: integration-secret-that-is-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e "./server[test]"
      - run: pytest server/tests

  compose-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets==15.0.1
      - run: bash ./deploy/scripts/init-secrets.sh
      - name: Start real Compose stack
        run: |
          printf '%s\n' \
            'POSTGRES_DB=intdemo' \
            'POSTGRES_USER=intdemo' \
            'SERVER_ADDRESS=127.0.0.1' \
            'CADDYFILE_PATH=./deploy/caddy/Caddyfile.ip' > .env
          docker compose up -d --build --wait --wait-timeout 240
      - name: Export private root and run two-client acceptance
        run: |
          bash ./deploy/scripts/export-internal-ca.sh /tmp/intdemo-root.crt
          python deploy/tests/acceptance.py https://127.0.0.1 /tmp/intdemo-root.crt
      - name: Verify backup and clean restore
        run: |
          docker compose run --rm backup /bin/bash /scripts/backup-now.sh
          docker compose run --rm backup /bin/bash /scripts/restore-latest.sh
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
